name: Auto-Generate SEO Blogs

on:
  schedule:
    # Runs every day at 09:00 UTC (or adjust cron time as needed)
    - cron: '0 9 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  auto-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Auto-Generate Blogs Script
        run: node scripts/auto-generate-blogs.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git status
          git add .
          git diff-index --quiet HEAD || git commit -m "🤖 Auto-generated daily SEO blog posts [GitHub Action]"
          git push origin main
